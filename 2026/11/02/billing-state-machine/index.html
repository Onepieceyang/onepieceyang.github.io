ategories/"><div class="headline">分类</div><div class="length-num">0</div></a></div><div class="menus_items"><div class="menus_item"><a class="site-page" href="/"><i class="fa-fw fas fa-home"></i><span> 首页</span></a></div><div class="menus_item"><a class="site-page" href="/archives/"><i class="fa-fw fas fa-archive"></i><span> 归档</span></a></div><div class="menus_item"><a class="site-page" href="/about/"><i class="fa-fw fas fa-user"></i><span> 关于我</span></a></div></div></div></div><div class="post" id="body-wrap"><header class="not-top-img" id="page-header"><nav id="nav"><span id="blog-info"><a class="nav-site-title" href="/"><span class="site-name">Yang</span></a><a class="nav-page-title" href="/"><span class="site-name">月末计息把 MySQL 连接池打满了</span><span class="site-name"><i class="fa-solid fa-circle-arrow-left"></i><span>  返回首页</span></span></a></span><div id="menus"><div class="menus_items"><div class="menus_item"><a class="site-page" href="/"><i class="fa-fw fas fa-home"></i><span> 首页</span></a></div><div class="menus_item"><a class="site-page" href="/archives/"><i class="fa-fw fas fa-archive"></i><span> 归档</span></a></div><div class="menus_item"><a class="site-page" href="/about/"><i class="fa-fw fas fa-user"></i><span> 关于我</span></a></div></div><div id="toggle-menu"><span class="site-page"><i class="fas fa-bars fa-fw"></i></span></div></div></nav></header><main class="layout" id="content-inner"><div id="post"><div id="post-info"><h1 class="post-title">月末计息把 MySQL 连接池打满了</h1><div id="post-meta"><div class="meta-firstline"><span class="post-meta-date"><i class="far fa-calendar-alt fa-fw post-meta-icon"></i><span class="post-meta-label">发表于</span><time class="post-meta-date-created" datetime="2026-11-02T02:30:00.000Z" title="发表于 2026-11-02 10:30:00">2026-11-02</time><span class="post-meta-separator">|</span><i class="fas fa-history fa-fw post-meta-icon"></i><span class="post-meta-label">更新于</span><time class="post-meta-date-updated" datetime="2026-11-02T06:34:37.965Z" title="更新于 2026-11-02 14:34:37">2026-11-02</time></span></div><div class="meta-secondline"><span class="post-meta-separator">|</span><span class="post-meta-pv-cv" id="" data-flag-title=""><i class="far fa-eye fa-fw post-meta-icon"></i><span class="post-meta-label">浏览量:</span><span id="busuanzi_value_page_pv"><i class="fa-solid fa-spinner fa-spin"></i></span></span></div></div></div><article class="container post-content" id="article-container"><p>富途证券收费计息系统的核心链路：计息 → 资金冻结 → 扣费 → 解冻。每一步都在动钱，任何一个环节失败都不能留下不一致的账。这篇文章记录这条链路的设计思路。</p>
<h2 id="为什么是状态机"><a href="#为什么是状态机" class="headerlink" title="为什么是状态机"></a>为什么是状态机</h2><p>计费订单从创建到终结，每个订单在任意时刻只能处于一个明确状态：</p>
<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br></pre></td><td class="code"><pre><span class="line">INIT → INTEREST_ACCRUED → FROZEN → CHARGED → UNFROZEN → DONE</span><br><span class="line">         │                  │         │</span><br><span class="line">         └── 失败 ──────────┴─────────┴──&gt; FAILED → 补偿 → 重试</span><br></pre></td></tr></table></figure>

<p>状态机解决了两个问题：</p>
<ol>
<li><strong>每一步迁移前置条件明确</strong>。扣费只允许从 <code>FROZEN</code> 迁出，没冻结就扣费属于系统 bug，直接告警。</li>
<li><strong>异常恢复有据可查</strong>。<code>FAILED</code> 状态的订单记录失败发生在哪一步，补偿任务按步重放，不重头再来。</li>
</ol>
<h2 id="月末大批量计费的-WorkerPool-优化"><a href="#月末大批量计费的-WorkerPool-优化" class="headerlink" title="月末大批量计费的 WorkerPool 优化"></a>月末大批量计费的 WorkerPool 优化</h2><p>月末计息是集中爆发的批处理，几百万账户要在一夜之内算完。最初的实现是每个 goroutine 各自拿 MySQL 连接写库，高峰期数据库连接池被打满，任务互相争抢。</p>
<p>改法是 WorkerPool 固定并发度：</p>
<figure class="highlight go"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">pool := NewWorkerPool(workerCount, dbPoolSize)</span><br><span class="line">pool.Submit(task)</span><br></pre></td></tr></table></figure>

<ul>
<li><strong>worker 数与 DB 连接数配比固定</strong>，避免 goroutine 数量失控拖垮连接池。</li>
<li><strong>任务粒度按账户拆分</strong>，单个账户计费失败不影响整批，失败账户进重试队列。</li>
<li><strong>幂等控制</strong>：每笔订单带唯一业务号，重试前先查状态，已完成直接跳过。</li>
</ul>
<p>配合失败补偿与告警体系，批处理任务从”跑完才知道错”变成”错一笔报一笔”。</p>
<h2 id="新旧接口双读对账"><a href="#新旧接口双读对账" class="headerlink" title="新旧接口双读对账"></a>新旧接口双读对账</h2><p>风控接口迁移时新旧系统并行。做法是双读：请求同时打到新旧两个接口，以旧接口结果为准写库，新接口结果留档比对。对账任务按日跑批，差异超阈值即告警。对账稳定后再切流，数据一致性有完整证据链。</p>
<h2 id="时态快照模型：期权计费迁移"><a href="#时态快照模型：期权计费迁移" class="headerlink" title="时态快照模型：期权计费迁移"></a>时态快照模型：期权计费迁移</h2><p>港股期权从 Python 迁 Go，难点在计费依据是”当时看到的费率”，不是”现在的费率”。时态快照模型把每个计费时点的费率、持仓、规则版本固化成快照：</p>
<ul>
<li><strong>双跑对账</strong>：新旧系统同时消费同一事件流，各自产出账单，逐字段比对。</li>
<li><strong>灰度切流</strong>：按客户维度小流量切换，出问题即时回切。</li>
<li><strong>试算与真实扣费严格隔离</strong>：试算链路只读，扣费链路独立部署独立权限，防止试算逻辑误触资金。</li>
</ul>
<p>迁移全程业务无感知。</p>

m-2">在 MacBook 上塞一个湖仓，只为弄懂它到底在干嘛</div></div><div class="info-2"><div class="info-item-1">湖仓（Lakehouse）的卖点一句话能说清：存储与计算解耦、ACID 事务、多引擎读写。但只看文档不动手很难有体感。这个项目用 Docker Compose 把 MinIO + Hive Metastore + Iceberg + Spark + Trino 一键拉起来，本地复现一套最小湖仓。 架构123456┌─────────────┐     ┌──────────────┐     ┌──────────────┐│   MinIO     │ ←── │ HiveMetastore│ ←── │  Spark / Trino││   (S3)      │     │  (元数据)     │     │  (计算引擎)    │└─────────────┘     └──────────────┘     └──────────────┘       ▲                                         │       └──────────── Parquet + Iceberg ──────────┘   MinIO 提供 S3 ...</div></div></div></a></nav><div class="relatedPosts"><div class="headline"><i class="fas fa-thumbs-up fa-fw"></i><span>相关推荐</span></div><div class="relatedPosts-list"><a class="pagination-related" href="/2026/11/02/ai-automate-billing/" title="计费链路能不能全 AI 自动化——我的真实答案"><div class="cover" style="background: var(--default-bg-color)"></div><div class="info text-center"><div class="info-1"><div class="info-item-1"><i class="far fa-calendar-alt fa-fw"></i> 2026-11-02</div><div class="info-item-2">计费链路能不能全 AI 自动化——我的真实答案</div></div><div class="info-2"><div class="info-item-1">做金融后端做久了，会冒出一个念头：这套东西能不能全交给 AI？需求来了，Agent 理解、写代码、跑对账、上线、出问题自己修。人只在边上看着。我认真想过这个问题，结论是：能自动一大部分，但”全”自动化在金融场景里是危险的想法。 先说能自动的部分需求到代码：计费业务规则高度结构化。”JP 区域期权持仓按日计息，费率取前一交易日收盘价，节假日顺延”——这种描述喂给 Agent，它能把状态机骨架、费率查询、日切逻辑生成得七七八八。前提是领域知识库够厚，这正是我们做的那个计费排查 Agent 沉淀的东西。 异常排查：线上告警来了，Agent 拉日志、对账单、费率快照，定位是哪一环出的问题。这块我们已经落地了，效率提升很明显。人的角色从”翻日志”变成”看 Agent 给的结论，拍板下一步”。 对账生成：新旧系统双跑，对账规则、字段映射、差异报告——Agent 生成模板，人审核。比手写省事太多。 必须人兜底的部分资金写操作。这是硬红线。Agent 永远不应该有”扣钱”的权限。原因不是技术做不到，是责任归属——一旦真扣错账，必须能指向一个具体的人做了具体决策。机器决策的钱出错，连追责都难。所以...</div></div></div></a><a class="pagination-related" href="/2026/11/02/reconciliation-mistake/" title="双跑对账跑了三天，差异就是不为零"><div class="cover" style="background: var(--default-bg-color)"></div><div class="info text-center"><div class="info-1"><div class="info-item-1"><i class="far fa-calendar-alt fa-fw"></i> 2026-11-02</div><div class="info-item-2">双跑对账跑了三天，差异就是不为零</div></div><div class="info-2"><div class="info-item-1">期权计费从 Python 迁 Go，上线前的流程是双跑对账：新旧系统吃同一份事件流，各自算账，逐字段比对，差异为零才算过。听起来很简单的一个动作，我们卡了三天。 第一天：差异一大片。 老系统的金额是 Decimal，新系统 Go 侧一开始用了 float64。我下意识觉得”这不至于吧，误差都在小数点后十位开外”。但对账是逐字段比，而且费率计算是连乘——十几个费率因子一路乘下来，第 8 位小数的误差被放大到分级。教训：涉及钱的计算，容器类型没有商量余地，Go 里直接上 decimal 库，入库字符串化，别让 ORM 偷偷转类型。 第二天：差异收敛到个位数，但清不掉。 对不上的是几笔”看起来随机”的订单。查了半天，是时区。老 Python 服务的计息日切分用的是服务器本地时区，某台机器配的 UTC，某台配的 UTC+8，日切边界上的订单归属日期就不一样。这个 bug 其实在老系统里就存在，只是一直没暴露——迁移对账反而把它翻出来了。这种事挺讽刺的：你以为你在验证新系统，其实在给老系统做免费体检。 第三天：差异只剩一笔，一个客户，每天都不对。 最后发现是快照时机问题。计费用的是”当天 ...</div></div></div></a></div></div></div><div class="aside-content" id="aside-content"><div class="card-widget card-info text-center"><div class="avatar-img"><img src="/img/avatar.svg" onerror="this.onerror=null;this.src='/img/friend_404.gif'" alt="avatar"/></div><div class="author-info-name">郭洋</div><div class="author-info-description"><div>后端工程师 · 富途</div> <div>金融账务系统 · 数据工程</div></div><div class="site-data"><a href="/archives/"><div class="headline">文章</div><div class="length-num">6</div></a><a href="/tags/"><div class="headline">标签</div><div class="length-num">19</div></a><a href="/categories/"><div class="headline">分类</div><div class="length-num">0</div></a></div><a id="card-info-btn" target="_blank" rel="noopener" href="https://github.com/xxxxxx"><i class="fab fa-github"></i><span>Follow Me</span></a><div class="card-info-social-icons"><a class="social-icon" href="https://github.com/Onepieceyang" target="_blank" title="Github"><i class="fab fa-github"></i></a><a class="social-icon" href="mailto:mark13612911661@163.com" target="_blank" title="Email"><i class="fas fa-envelope"></i></a></div></div><div class="sticky_layout"><div class="card-widget" id="card-toc"><div class="item-headline"><i class="fas fa-stream"></i><span>目录</span><span class="toc-percentage"></span></div><div class="toc-content"><ol class="toc"><li class="toc-item toc-level-2"><a class="toc-link" href="#%E4%B8%BA%E4%BB%8
